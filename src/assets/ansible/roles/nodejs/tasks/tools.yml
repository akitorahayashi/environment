---
- name: "Load packages JSON content"
  ansible.builtin.slurp:
    src: "{{ local_config_root }}/nodejs/global/global-packages.json"
  register: nodejs_pkg_file_raw

- name: "Parse package JSON"
  ansible.builtin.set_fact:
    nodejs_pkg_content: "{{ nodejs_pkg_file_raw.content | b64decode | from_json }}"

- name: "Combine dependency keys (dependencies and globalPackages)"
  ansible.builtin.set_fact:
    nodejs_packages_to_install: >-
      {{ (nodejs_pkg_content.dependencies | default({}))
         | combine(nodejs_pkg_content.globalPackages | default({}))
         | dict2items | map(attribute='key') | list }}

- name: "Check installed global Node.js packages"
  ansible.builtin.command:
    cmd: "fnm exec --using={{ nodejs_version }} -- pnpm ls -g {{ item }} --depth=0"
  loop: "{{ nodejs_packages_to_install }}"
  register: nodejs_pnpm_ls_result
  changed_when: false
  failed_when: false
  vars:
    pnpm_home: "{{ ansible_facts['env']['HOME'] }}/Library/pnpm"
  environment:
    PNPM_HOME: "{{ pnpm_home }}"
    PATH: "{{ nodejs_homebrew_bin_path }}:{{ pnpm_home }}:{{ ansible_facts['env']['PATH'] }}"

- name: "Uninstall existing global Node.js packages before reinstall"
  ansible.builtin.command:
    cmd: "fnm exec --using={{ nodejs_version }} -- pnpm rm -g {{ item.item }}"
  loop: "{{ nodejs_pnpm_ls_result.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0
  changed_when: true
  vars:
    pnpm_home: "{{ ansible_facts['env']['HOME'] }}/Library/pnpm"
  environment:
    PNPM_HOME: "{{ pnpm_home }}"
    PATH: "{{ nodejs_homebrew_bin_path }}:{{ pnpm_home }}:{{ ansible_facts['env']['PATH'] }}"

- name: "Install global Node.js packages"
  ansible.builtin.command:
    cmd: "fnm exec --using={{ nodejs_version }} -- pnpm add -g {{ item }}@latest"
  loop: "{{ nodejs_packages_to_install }}"
  changed_when: true
  vars:
    pnpm_home: "{{ ansible_facts['env']['HOME'] }}/Library/pnpm"
  environment:
    PNPM_HOME: "{{ pnpm_home }}"
    PATH: "{{ nodejs_homebrew_bin_path }}:{{ pnpm_home }}:{{ ansible_facts['env']['PATH'] }}"
