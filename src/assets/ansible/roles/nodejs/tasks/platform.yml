---
- name: "Reject non-macOS hosts"
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Darwin'
    fail_msg: >-
      nodejs role supports macOS only. Current platform is
      {{ ansible_facts['system'] }}.

- name: "Install fnm, jq, and pnpm"
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop:
    - fnm
    - jq
    - pnpm

- name: "Find Homebrew prefix"
  ansible.builtin.command:
    cmd: "brew --prefix"
  register: nodejs_homebrew_prefix
  changed_when: false

- name: "Set Homebrew binary path"
  ansible.builtin.set_fact:
    nodejs_homebrew_bin_path: "{{ nodejs_homebrew_prefix.stdout }}/bin"

- name: "Set npm global config path"
  ansible.builtin.set_fact:
    nodejs_npm_global_config_path: "{{ [ansible_facts['env']['HOME'], '.npmrc'] | path_join }}"

- name: "Symlink npm global config"
  ansible.builtin.file:
    src: "{{ local_config_root }}/nodejs/global/.npmrc"
    dest: "{{ nodejs_npm_global_config_path }}"
    state: link
    force: true

- name: "Set pnpm global YAML config path"
  ansible.builtin.set_fact:
    nodejs_pnpm_global_config_path: >-
      {{ ([ansible_facts['env']['XDG_CONFIG_HOME'], 'pnpm', 'config.yaml'] | path_join)
         if (ansible_facts['env']['XDG_CONFIG_HOME'] | default('') | length > 0)
         else ([ansible_facts['env']['HOME'], 'Library', 'Preferences', 'pnpm', 'config.yaml'] | path_join) }}

- name: "Ensure pnpm global YAML config directory exists"
  ansible.builtin.file:
    path: "{{ nodejs_pnpm_global_config_path | dirname }}"
    state: directory
    mode: "0755"

- name: "Symlink pnpm global YAML config"
  ansible.builtin.file:
    src: "{{ local_config_root }}/nodejs/global/pnpm/config.yaml"
    dest: "{{ nodejs_pnpm_global_config_path }}"
    state: link
    force: true

- name: "Install specified Node.js version with fnm"
  ansible.builtin.command:
    cmd: "fnm install {{ nodejs_version }} --progress=never"
  register: nodejs_fnm_install
  changed_when: "'already installed' not in (nodejs_fnm_install.stdout ~ nodejs_fnm_install.stderr)"
  environment:
    PATH: "{{ nodejs_homebrew_bin_path }}:{{ ansible_facts['env']['PATH'] }}"

- name: "Set default Node.js version"
  ansible.builtin.command:
    cmd: "fnm default {{ nodejs_version }}"
  changed_when: false
  environment:
    PATH: "{{ nodejs_homebrew_bin_path }}:{{ ansible_facts['env']['PATH'] }}"
