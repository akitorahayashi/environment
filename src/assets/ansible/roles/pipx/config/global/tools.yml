  - name: mlx-lm
  - name: huggingface-hub
  - name: openai-whisper
  - name: dcv
    git: https://github.com/akitorahayashi/dcv.git
    tag: v0.5.0
    post_install_inject: "playwright"
    post_install_exec: "$HOME/.local/pipx/venvs/dcv/bin/playwright install chromium"
