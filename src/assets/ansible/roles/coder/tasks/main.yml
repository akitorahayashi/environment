---
- name: "Set coder CLI paths"
  ansible.builtin.set_fact:
    coder_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    coder_command_path: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: "Prepare shared agent files"
  ansible.builtin.include_tasks: agents.yml

- name: "Install and configure Claude Code"
  ansible.builtin.include_tasks: claude.yml

- name: "Install and configure Codex"
  ansible.builtin.include_tasks: codex.yml

- name: "Install and configure Antigravity CLI"
  ansible.builtin.include_tasks: antigravity-cli.yml

- name: "Verify RTK availability"
  ansible.builtin.include_tasks: rtk.yml

- name: "Deploy agent skills"
  ansible.builtin.include_tasks: skills.yml
