---
- name: Ensure .ssh directory exists with correct permissions
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Ensure .ssh/conf.d directory exists with correct permissions
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/conf.d"
    state: directory
    mode: "0700"

- name: Symlink main ssh config file
  ansible.builtin.file:
    src: "{{ local_config_root }}/ssh/global/config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    state: link
    force: true
