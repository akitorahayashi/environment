---
- name: "Check if Bun is installed"
  ansible.builtin.command:
    cmd: "bun --version"
  register: bun_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.bun/bin:{{ ansible_facts['env']['PATH'] }}"

- name: "Install Bun via official installer" # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: "curl -fsSL https://bun.sh/install | bash"
  when: bun_check.rc != 0
  changed_when: true

- name: "Set Bun binary path"
  ansible.builtin.set_fact:
    bun_bin_path: "{{ ansible_facts['env']['HOME'] }}/.bun/bin"

- name: "Verify Bun version"
  ansible.builtin.command:
    cmd: "bun --version"
  register: bun_version_check
  changed_when: false
  environment:
    PATH: "{{ bun_bin_path }}:{{ ansible_facts['env']['PATH'] }}"

- name: "Verify Bun revision"
  ansible.builtin.command:
    cmd: "bun --revision"
  register: bun_revision_check
  changed_when: false
  environment:
    PATH: "{{ bun_bin_path }}:{{ ansible_facts['env']['PATH'] }}"

- name: "Deploy global bunfig.toml"
  ansible.builtin.copy:
    src: "{{ local_config_root }}/bun/global/.bunfig.toml"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bunfig.toml"
    mode: "0644"

- name: "Load Bun packages configuration"
  ansible.builtin.slurp:
    src: "{{ local_config_root }}/bun/global/global-packages.json"
  register: bun_packages_file_raw

- name: "Parse Bun packages configuration"
  ansible.builtin.set_fact:
    bun_packages_content: "{{ bun_packages_file_raw.content | b64decode | from_json }}"

- name: "Read installed Bun global package manifests"
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.bun/install/global/node_modules/{{ item.key }}/package.json"
  loop: "{{ bun_packages_content.dependencies | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: bun_global_package_manifests
  changed_when: false
  failed_when: false

- name: "Install Bun global packages"
  ansible.builtin.command:
    cmd: >-
      bun install --global {{ item.key }}@{{ item.value | default('latest') }}
  loop: "{{ bun_packages_content.dependencies | default({}) | dict2items }}"
  loop_control:
    index_var: idx
    label: "{{ item.key }}"
  changed_when: true
  environment:
    PATH: "{{ bun_bin_path }}:{{ ansible_facts['env']['PATH'] }}"
  when: >-
    (item.value | default('latest')) == 'latest' or
    bun_global_package_manifests.results[idx].failed | default(false) or
    (
      (
        bun_global_package_manifests.results[idx].content
        | b64decode
        | from_json
      ).version != item.value
    )
