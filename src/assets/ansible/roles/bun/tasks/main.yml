---
- name: "Check if Bun binary exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bun/bin/bun"
  register: bun_binary

- name: "Install Bun via official installer" # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell:
    cmd: "curl -fsSL https://bun.sh/install | bash"
  register: bun_install_result
  retries: 3
  delay: 10
  until: bun_install_result is succeeded
  when: not bun_binary.stat.exists
  changed_when: true

- name: "Verify Bun version"
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.bun/bin/bun"
      - --version
  register: bun_version_check
  changed_when: false

- name: "Verify Bun revision"
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['env']['HOME'] }}/.bun/bin/bun"
      - --revision
  register: bun_revision_check
  changed_when: false

- name: "Deploy global bunfig.toml"
  ansible.builtin.copy:
    src: "{{ local_config_root }}/bun/global/.bunfig.toml"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bunfig.toml"
    mode: "0644"
