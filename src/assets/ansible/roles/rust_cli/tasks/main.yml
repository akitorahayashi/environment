---
- name: "Load tools configuration"
  ansible.builtin.include_vars:
    file: "{{ local_config_root }}/rust_cli/global/tools.yml"
    name: rust_cli_config

- name: "Load platform mapping configuration"
  ansible.builtin.include_vars:
    file: "{{ local_config_root }}/rust_cli/global/platforms.yml"
    name: rust_cli_platforms

- name: "Set platform and binary directory"
  ansible.builtin.set_fact:
    rust_cli_os: "{{ rust_cli_platforms.os_mapping[ansible_facts['system']] | default('') }}"
    rust_cli_arch: "{{ rust_cli_platforms.arch_mapping[ansible_facts['architecture']] | default('') }}"
    rust_cli_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin"

- name: "Reject unsupported platform"
  ansible.builtin.assert:
    that:
      - rust_cli_os | length > 0
      - rust_cli_arch | length > 0
    fail_msg: "Unsupported platform: {{ ansible_facts['system'] }}/{{ ansible_facts['architecture'] }}"

- name: "Ensure binary directory exists"
  ansible.builtin.file:
    path: "{{ rust_cli_bin_dir }}"
    state: directory
    mode: "0755"

- name: "Check installed versions"
  ansible.builtin.command:
    argv:
      - "{{ rust_cli_bin_dir }}/{{ item.name }}"
      - --version
  loop: "{{ rust_cli_config.tools }}"
  loop_control:
    label: "{{ item.name }}"
  register: rust_cli_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Remove missing or outdated binaries"
  ansible.builtin.file:
    path: "{{ rust_cli_bin_dir }}/{{ item.name }}"
    state: absent
  loop: "{{ rust_cli_config.tools }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  when: >
    rust_cli_version_check.results[idx].rc != 0 or
    not rust_cli_version_check.results[idx].stdout
      | regex_search('\\b' + (item.tag | regex_replace('^v', '')) + '\\b')

- name: "Download public release binaries"
  ansible.builtin.get_url:
    url: "{{ item.url }}/releases/download/{{ item.tag }}/{{ item.name }}-{{ rust_cli_os }}-{{ rust_cli_arch }}"
    dest: "{{ rust_cli_bin_dir }}/{{ item.name }}"
    mode: "0755"
  loop: "{{ rust_cli_config.tools }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  when: >
    item.url is match('^https://') and
    (
      rust_cli_version_check.results[idx].rc != 0 or
      not rust_cli_version_check.results[idx].stdout
        | regex_search('\\b' + (item.tag | regex_replace('^v', '')) + '\\b')
    )

- name: "Install private release binaries"
  ansible.builtin.include_tasks: private-release.yml
  loop: "{{ rust_cli_config.tools }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  when: >
    not ansible_check_mode and
    item.url is match('^git@') and
    (
      rust_cli_version_check.results[idx].rc != 0 or
      not rust_cli_version_check.results[idx].stdout
        | regex_search('\\b' + (item.tag | regex_replace('^v', '')) + '\\b')
    )
