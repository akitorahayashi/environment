---
- name: "Install cask packages from bundle file (profile-specific or global fallback)"
  ansible.builtin.command:
    cmd: "brew bundle --file={{ brewfile_path }}"
  register: brew_bundle_result
  changed_when: "'Installing' in brew_bundle_result.stdout"
  vars:
    brewfile_path: "{{ lookup('first_found', brewfile_candidates) }}"
    brewfile_candidates:
      - "{{ local_config_root }}/brew/profiles/{{ profile }}/Brewfile.casks"
      - "{{ local_config_root }}/brew/global/Brewfile.casks"
