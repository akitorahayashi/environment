---
- name: "Symlink dotfiles"
  ansible.builtin.file:
    src: "{{ local_config_root }}/shell/global/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: link
    force: true
  loop:
    - .zshenv
    - .zprofile
    - .zshrc

# --- create symbolic links for all files in local_config_root/shell/global/alias/
- name: "Ensure ~/.mev/alias directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.mev/alias"
    state: directory
    mode: "0755"

- name: "Find shell config files recursively"
  ansible.builtin.find:
    paths: "{{ local_config_root }}/shell/global/alias"
    patterns: ["*.sh", "*.zsh"]
    recurse: true
  register: shell_config_files

- name: "Find deployed shell config links"
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.mev/alias"
    file_type: link
    recurse: true
  register: shell_config_deployed_links

- name: "Calculate expected shell config link paths"
  ansible.builtin.set_fact:
    shell_config_expected_links: >-
      {{ shell_config_files.files | map(attribute='path')
         | map('relpath', local_config_root + '/shell/global/alias')
         | map('regex_replace', '^(.*)$', ansible_facts['env']['HOME'] + '/.mev/alias/\1')
         | list }}

- name: "Remove stale shell config links"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ shell_config_deployed_links.files }}"
  when:
    - item.path not in shell_config_expected_links
    - (item.lnk_target | default('')).startswith(local_config_root + '/shell/global/alias/')

- name: "Calculate unique subdirectories for shell config files"
  ansible.builtin.set_fact:
    shell_config_subdirs: >-
      {{ shell_config_files.files | map(attribute='path')
         | map('relpath', local_config_root + '/shell/global/alias')
         | map('dirname') | unique | reject('equalto', '.') | list }}

- name: "Create subdirectories in ~/.mev/alias"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.mev/alias/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ shell_config_subdirs }}"

- name: "Symlink shell config files recursively"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: >-
      {{ ansible_facts['env']['HOME'] }}/.mev/alias/{{ item.path | relpath(local_config_root + '/shell/global/alias') }}
    state: link
    force: true
  loop: "{{ shell_config_files.files }}"
