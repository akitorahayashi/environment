---
- name: "Install Google Antigravity"
  community.general.homebrew_cask:
    name: antigravity
    state: present

- name: "Ensure Antigravity User directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Antigravity/User"
    state: directory
    mode: "0755"

- name: "Symlink Antigravity shared config files"
  ansible.builtin.file:
    src: "{{ local_config_root }}/editor/global/antigravity/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/Application Support/Antigravity/User/{{ item }}"
    state: link
    force: true
  loop:
    - settings.json
    - keybindings.json

- name: "Read Antigravity extensions list"
  ansible.builtin.slurp:
    src: "{{ local_config_root }}/editor/global/antigravity/extensions.json"
  register: editor_antigravity_extensions_content

- name: "Parse Antigravity extensions JSON"
  ansible.builtin.set_fact:
    editor_antigravity_extensions: "{{ (editor_antigravity_extensions_content.content | b64decode | from_json).extensions }}"

- name: "Install Antigravity extensions"
  ansible.builtin.command: "agy --install-extension {{ item }} --force"
  loop: "{{ editor_antigravity_extensions }}"
  changed_when: true

- name: "Ensure Antigravity agent skills parent directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/google/antigravity"
    state: directory
    mode: "0755"

# Note: Agent skills deployment is handled by nodejs/coder role via skills-targets.yml
# Skills are automatically deployed from ~/.config/mev/roles/nodejs/global/coder/skills/
# to ~/.config/google/antigravity/skills/ when the 'coder' role runs
