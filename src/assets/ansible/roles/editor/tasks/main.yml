---
- name: "Install and configure Visual Studio Code"
  ansible.builtin.include_tasks: vscode.yml
  when: "'vscode' in ansible_run_tags or 'co' in ansible_run_tags"

- name: "Install and configure Google Antigravity IDE"
  ansible.builtin.include_tasks: antigravity-ide.yml
  when: "'antigravity-ide' in ansible_run_tags or 'agy-ide' in ansible_run_tags"

- name: "Install and configure Zed"
  ansible.builtin.include_tasks: zed.yml
  when: "'zed' in ansible_run_tags or 'zd' in ansible_run_tags"

- name: Configure Xcode settings
  ansible.builtin.include_tasks: xcode.yml
  when: "'xcode' in ansible_run_tags or 'xc' in ansible_run_tags"
