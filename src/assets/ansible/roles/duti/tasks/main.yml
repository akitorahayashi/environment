---
- name: "Load application configuration"
  ansible.builtin.include_vars:
    file: "{{ local_config_root }}/duti/global/default_apps.yml"
    name: duti_default_apps

- name: "Validate application collection"
  ansible.builtin.assert:
    that:
      - duti_default_apps.default_apps is defined
      - duti_default_apps.default_apps is sequence
    fail_msg: "default_apps must be a sequence"

- name: "Validate application entries"
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.bundle_id | default('') is string
      - item.bundle_id | default('') | trim | length > 0
      - item.bundle_id | default('') == item.bundle_id | default('') | trim
      - item.extensions | default([]) is sequence
      - item.extensions | default([]) | length > 0
    fail_msg: >-
      Each default_apps entry requires a bundle_id and a non-empty
      extensions sequence
  loop: "{{ duti_default_apps.default_apps }}"
  loop_control:
    label: "{{ item.bundle_id | default('invalid entry') }}"

- name: "Validate application extensions"
  ansible.builtin.assert:
    that:
      - item.1 is string
      - item.1 is match('^[^./\\s]+$')
    fail_msg: "Each extension must be a string without dots or whitespace"
  loop: "{{ duti_default_apps.default_apps | subelements('extensions') }}"
  loop_control:
    label: "{{ item.0.bundle_id }}:{{ item.1 }}"

- name: "Normalize applications"
  ansible.builtin.set_fact:
    duti_app_items: >-
      {%- set items = [] -%}
      {%- for app in duti_default_apps.default_apps -%}
      {%-   for extension in app.extensions -%}
      {%-     set _ = items.append({
                'bundle_id': app.bundle_id,
                'extension': extension
              }) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "Reject duplicate application extensions"
  ansible.builtin.assert:
    that:
      - >-
        duti_app_items
        | map(attribute='extension')
        | map('lower')
        | list
        | length
        ==
        duti_app_items
        | map(attribute='extension')
        | map('lower')
        | unique
        | list
        | length
    fail_msg: "default_apps contains duplicate extensions"

- name: "Read current applications"
  ansible.builtin.command:
    argv:
      - duti
      - -x
      - "{{ item.extension }}"
  loop: "{{ duti_app_items }}"
  loop_control:
    label: "{{ item.extension }}"
  register: duti_app_queries
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Reject unexpected application query failures"
  ansible.builtin.assert:
    that:
      - >-
        item.rc in [0, 1]
        or "Failed to get default application for extension"
        in (item.stderr | default(''))
    fail_msg: >-
      Failed to inspect the current default application for extension
      '{{ item.item.extension }}': {{ item.stderr | default('unknown error') }}
  loop: "{{ duti_app_queries.results }}"
  loop_control:
    label: "{{ item.item.extension }}"

- name: "Apply applications"
  ansible.builtin.command:
    argv:
      - duti
      - -s
      - "{{ item.bundle_id }}"
      - ".{{ item.extension }}"
      - all
  loop: "{{ duti_app_items }}"
  loop_control:
    index_var: duti_app_index
    label: "{{ item.extension }}"
  when: >-
    duti_app_queries.results[duti_app_index].rc != 0
    or
    (
      duti_app_queries.results[duti_app_index].stdout_lines
      | last
      | default('')
    ) != item.bundle_id
  changed_when: true
