---
- name: Setup macOS development environment
  hosts: localhost
  connection: local
  vars:
    tag_groups:
      rust: ["rust-platform", "rust-tools"]
      bun: ["bun"]
      go: ["go-platform", "go-tools"]
      desktop: ["vscode", "antigravity-ide", "zed", "ghostty"]
    tap_requirements: {}
    formula_requirements:
      python: ["uv"]
      py: ["uv"]
      pipx: ["pipx"]
      px: ["pipx"]
      nodejs: ["fnm"]
      nd: ["fnm"]
      pnpm: ["pnpm"]
      pn: ["pnpm"]
      ruby: ["openssl@3", "rbenv", "ruby-build"]
      rb: ["openssl@3", "rbenv", "ruby-build"]
      go-platform: ["goenv"]
      go-p: ["goenv"]
      go-tools: ["goenv"]
      go-t: ["goenv"]
      git: ["git"]
      gh: ["gh"]
      nvim: ["neovim"]
      nv: ["neovim"]
      system: ["displayplacer"]
      sys: ["displayplacer"]
      ollama: ["ollama"]
      ol: ["ollama"]
    cask_requirements:
      vscode: ["visual-studio-code"]
      co: ["visual-studio-code"]
      antigravity-ide: ["antigravity-ide"]
      agy-ide: ["antigravity-ide"]
      zed: ["zed"]
      zd: ["zed"]
      ghostty: ["ghostty"]
      gst: ["ghostty"]
    full_setup_tags:
      - brew-formulae
      - ollama
      - shell
      - system
      - git
      - gh
      - python
      - pipx
      - nodejs
      - pnpm
      - bun
      - ruby
      - rust-platform
      - go-platform
      - rust-tools
      - go-tools
      - vscode
      - zed
      - nvim
      - coder
      - ghostty
      - mlx
      - xcode
  roles:
    - { role: brew, tags: ["brew-formulae", "br-f", "brew-cask", "br-c"] }
    - { role: python, tags: ["python", "py"] }
    - { role: pipx, tags: ["pipx", "px"] }
    - { role: nodejs, tags: ["nodejs", "nd"] }
    - { role: pnpm, tags: ["pnpm", "pn"] }
    - { role: bun, tags: ["bun", "b"] }
    - { role: coder, tags: ["coder", "cdr", "agy"] }
    - { role: ruby, tags: ["ruby", "rb"] }
    - { role: rust, tags: ["rust-platform", "rs-p", "rust-tools", "rs-t"] }
    - { role: go, tags: ["go-platform", "go-p", "go-tools", "go-t"] }
    - { role: git, tags: ["git"] }
    - { role: gh, tags: ["gh"] }
    - { role: ghostty, tags: ["ghostty", "gst"] }
    - { role: nvim, tags: ["nvim", "nv"] }
    - { role: shell, tags: ["shell", "sh"] }
    - { role: editor, tags: ["vscode", "co", "antigravity-ide", "agy-ide", "zed", "zd", "xcode", "xc"] }
    - { role: system, tags: ["system", "sys"] }
    - { role: llm, tags: ["ollama", "ol", "ollama-models", "ol-m", "mlx", "mlx-models"] }
