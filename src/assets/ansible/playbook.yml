---
- name: Setup macOS development environment
  hosts: localhost
  connection: local
  vars:
    tag_groups:
      rust: ["rust-platform", "rust-tools"]
      python: ["python-platform", "python-tools"]
      nodejs: ["nodejs-platform", "nodejs-tools"]
      bun: ["bun-platform", "bun-tools"]
      go: ["go-platform", "go-tools"]
      desktop: ["vscode", "antigravity-ide", "zed", "ghostty"]
    tap_requirements:
      bun-platform: ["oven-sh/bun"]
      b-p: ["oven-sh/bun"]
      bun-tools: ["oven-sh/bun"]
      b-t: ["oven-sh/bun"]
    formula_requirements:
      python-platform: ["uv"]
      py-p: ["uv"]
      python-tools: ["uv", "pipx"]
      py-t: ["uv", "pipx"]
      nodejs-platform: ["fnm", "jq", "pnpm"]
      nd-p: ["fnm", "jq", "pnpm"]
      nodejs-tools: ["fnm", "jq", "pnpm"]
      nd-t: ["fnm", "jq", "pnpm"]
      coder: ["fnm", "jq", "pnpm"]
      cdr: ["fnm", "jq", "pnpm"]
      bun-platform: ["oven-sh/bun/bun"]
      b-p: ["oven-sh/bun/bun"]
      bun-tools: ["oven-sh/bun/bun"]
      b-t: ["oven-sh/bun/bun"]
      ruby: ["openssl@3", "rbenv", "ruby-build"]
      rb: ["openssl@3", "rbenv", "ruby-build"]
      go-platform: ["goenv"]
      go-p: ["goenv"]
      go-tools: ["goenv"]
      go-t: ["goenv"]
      git: ["git"]
      gh: ["gh"]
      nvim: ["neovim"]
      nv: ["neovim"]
      system: ["displayplacer"]
      sys: ["displayplacer"]
      ollama: ["ollama"]
      ol: ["ollama"]
    cask_requirements:
      vscode: ["visual-studio-code"]
      co: ["visual-studio-code"]
      antigravity-ide: ["antigravity-ide"]
      agy-ide: ["antigravity-ide"]
      antigravity: ["antigravity-ide"]
      agy: ["antigravity-ide"]
      zed: ["zed"]
      zd: ["zed"]
      ghostty: ["ghostty"]
      gst: ["ghostty"]
    full_setup_tags:
      - brew-formulae
      - ollama
      - shell
      - system
      - git
      - gh
      - python-platform
      - nodejs-platform
      - bun-platform
      - ruby
      - rust-platform
      - go-platform
      - python-tools
      - nodejs-tools
      - rust-tools
      - go-tools
      - vscode
      - zed
      - nvim
      - coder
      - ghostty
      - mlx
      - xcode
  roles:
    - { role: brew, tags: ["brew-formulae", "br-f", "brew-cask", "br-c"] }
    - { role: python, tags: ["python-platform", "py-p", "python-tools", "py-t"] }
    - { role: nodejs, tags: ["nodejs-platform", "nd-p", "nodejs-tools", "nd-t", "coder", "cdr"] }
    - { role: bun, tags: ["bun-platform", "b-p", "bun-tools", "b-t"] }
    - { role: ruby, tags: ["ruby", "rb"] }
    - { role: rust, tags: ["rust-platform", "rs-p", "rust-tools", "rs-t"] }
    - { role: go, tags: ["go-platform", "go-p", "go-tools", "go-t"] }
    - { role: git, tags: ["git"] }
    - { role: gh, tags: ["gh"] }
    - { role: ghostty, tags: ["ghostty", "gst"] }
    - { role: nvim, tags: ["nvim", "nv"] }
    - { role: shell, tags: ["shell", "sh"] }
    - { role: editor, tags: ["vscode", "co", "antigravity-ide", "agy-ide", "antigravity", "agy", "zed", "zd", "xcode", "xc"] }
    - { role: system, tags: ["system", "sys"] }
    - { role: llm, tags: ["ollama", "ol", "ollama-models", "ol-m", "mlx", "mlx-models"] }
