---
- name: Setup macOS development environment
  hosts: localhost
  connection: local
  vars:
    tag_groups:
      bun: ["bun"]
      desktop: ["vscode", "antigravity-ide", "zed", "ghostty"]
    tap_requirements: {}
    formula_requirements:
      python: ["uv"]
      py: ["uv"]
      pipx: ["pipx"]
      px: ["pipx"]
      nodejs: ["fnm"]
      nd: ["fnm"]
      pnpm: ["pnpm"]
      pn: ["pnpm"]
      ruby: ["openssl@3", "rbenv", "ruby-build"]
      rb: ["openssl@3", "rbenv", "ruby-build"]
      rust-cli: ["gh"]
      rs-c: ["gh"]
      git: ["git"]
      gh: ["gh"]
      nvim: ["neovim"]
      nv: ["neovim"]
      system: ["displayplacer"]
      sys: ["displayplacer"]
    cask_requirements:
      vscode: ["visual-studio-code"]
      co: ["visual-studio-code"]
      antigravity-ide: ["antigravity-ide"]
      agi: ["antigravity-ide"]
      zed: ["zed"]
      zd: ["zed"]
      ghostty: ["ghostty"]
      gst: ["ghostty"]
    full_setup_tags:
      - brew-formulae
      - shell
      - system
      - git
      - gh
      - python
      - pipx
      - nodejs
      - pnpm
      - bun
      - ruby
      - rust
      - rust-cli
      - vscode
      - zed
      - nvim
      - coder
      - ghostty
      - xcode
  roles:
    - { role: brew, tags: ["brew-formulae", "br-f", "brew-cask", "br-c"] }
    - { role: python, tags: ["python", "py"] }
    - { role: pipx, tags: ["pipx", "px"] }
    - { role: nodejs, tags: ["nodejs", "nd"] }
    - { role: pnpm, tags: ["pnpm", "pn"] }
    - { role: bun, tags: ["bun", "b"] }
    - { role: coder, tags: ["coder", "cdr"] }
    - { role: ruby, tags: ["ruby", "rb"] }
    - { role: rust, tags: ["rust", "rs"] }
    - { role: rust_cli, tags: ["rust-cli", "rs-c"] }
    - { role: git, tags: ["git"] }
    - { role: gh, tags: ["gh"] }
    - { role: ghostty, tags: ["ghostty", "gst"] }
    - { role: nvim, tags: ["nvim", "nv"] }
    - { role: shell, tags: ["shell", "sh"] }
    - { role: editor, tags: ["vscode", "co", "antigravity-ide", "agi", "zed", "zd", "xcode", "xc"] }
    - { role: system, tags: ["system", "sys"] }
