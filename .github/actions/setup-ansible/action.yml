name: Setup Ansible
description: Install pipx-managed ansible and export its ansible-playbook path for CI

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
      with:
        python-version: '3.12'

    - name: Resolve pipx paths
      id: pipx-paths
      shell: bash
      run: |
        echo "pipx_home=${HOME}/.local/pipx" >> "$GITHUB_OUTPUT"

    - name: Cache pipx ansible environment
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.2.3
      with:
        path: ${{ steps.pipx-paths.outputs.pipx_home }}
        key: pipx-${{ runner.os }}-py312-pipx-1.8.0-ansible-11.0.0

    - name: Install ansible with pipx
      id: install-ansible
      shell: bash
      env:
        PIPX_HOME: ${{ steps.pipx-paths.outputs.pipx_home }}
      run: |
        python -m pip install --user pipx==1.8.0
        ansible_playbook_bin="${PIPX_HOME}/venvs/ansible/bin/ansible-playbook"
        if [ ! -x "$ansible_playbook_bin" ]; then
          python -m pipx install ansible==11.0.0
        fi
        test -x "$ansible_playbook_bin"
        echo "ansible_playbook_bin=$ansible_playbook_bin" >> "$GITHUB_OUTPUT"

    - name: Verify ansible-playbook availability
      shell: bash
      run: |
        "${{ steps.install-ansible.outputs.ansible_playbook_bin }}" --version
