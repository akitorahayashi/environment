name: Setup Build
description: Install mise-managed just, the Rust toolchain, and Rust build cache for CI

runs:
  using: "composite"
  steps:
    - name: Setup mise with locked project tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: '2026.2.19'
        install_args: --locked just

    - name: Set up Rust toolchain
      shell: bash
      run: rustup toolchain install 1.90.0 --profile default --component clippy --component rustfmt

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
