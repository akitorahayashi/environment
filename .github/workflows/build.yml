name: Build

on:
  workflow_call:
    inputs:
      release_id:
        required: false
        type: string

jobs:
  build-darwin-aarch64:
    name: Build mev darwin-aarch64
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Add Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Build release binary
        run: mise exec -- just build-release-darwin-aarch64

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          cp target/aarch64-apple-darwin/release/mev mev-darwin-aarch64
          chmod +x mev-darwin-aarch64
          shasum -a 256 mev-darwin-aarch64 > mev-darwin-aarch64.sha256

      - name: Upload release assets
        if: inputs.release_id != ''
        uses: akitorahayashi/gh-release@aa696643869780261a02c3f5775f36b32b4faab5 # v1.0.3
        with:
          mode: upload
          token: ${{ github.token }}
          release_id: ${{ inputs.release_id }}
          files: |
            mev-darwin-aarch64
            mev-darwin-aarch64.sha256
          overwrite: true
