name: Run Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run Rust tests
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Run tests
        run: mise exec -- just test
