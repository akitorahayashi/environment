name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}

    steps:
      - id: prepare
        uses: akitorahayashi/gh-release@aa696643869780261a02c3f5775f36b32b4faab5 # v1.0.4
        with:
          mode: prepare
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          create: true
          generate_notes: true

  build-and-upload:
    needs:
      - prepare-release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release_id: ${{ needs.prepare-release.outputs.release_id }}

  publish-release:
    needs:
      - prepare-release
      - build-and-upload
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: akitorahayashi/gh-release@aa696643869780261a02c3f5775f36b32b4faab5 # v1.0.4
        with:
          mode: publish
          token: ${{ github.token }}
          release_id: ${{ needs.prepare-release.outputs.release_id }}
          publish: true
