name: Verify Ansible Setup

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/assets/ansible/**'
      - '.github/workflows/setup-*.yml'
      - '.github/workflows/verify-ansible-setup.yml'
      - '.github/actions/setup-build/**'
      - '.github/actions/setup-ansible/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/assets/ansible/**'
      - '.github/workflows/setup-*.yml'
      - '.github/workflows/verify-ansible-setup.yml'
      - '.github/actions/setup-build/**'
      - '.github/actions/setup-ansible/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Setup target to run (all or a specific setup workflow)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - python
          - nodejs
          - bun
          - ruby
          - rust
          - go
          - nvim
          - ide
          - system
          - brew-formulae

jobs:
  changes:
    name: Detect setup-related changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all_setups: ${{ steps.filter.outputs.all_setups }}
      setup_python: ${{ steps.filter.outputs.setup_python }}
      setup_nodejs: ${{ steps.filter.outputs.setup_nodejs }}
      setup_bun: ${{ steps.filter.outputs.setup_bun }}
      setup_ruby: ${{ steps.filter.outputs.setup_ruby }}
      setup_rust: ${{ steps.filter.outputs.setup_rust }}
      setup_go: ${{ steps.filter.outputs.setup_go }}
      setup_nvim: ${{ steps.filter.outputs.setup_nvim }}
      setup_ide: ${{ steps.filter.outputs.setup_ide }}
      setup_system: ${{ steps.filter.outputs.setup_system }}
      setup_brew_formulae: ${{ steps.filter.outputs.setup_brew_formulae }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v3.0.2
        with:
          filters: |
            all_setups:
              - 'src/assets/ansible/playbook.yml'
              - 'src/assets/ansible/ansible.cfg'
              - '.github/actions/setup-build/**'
              - '.github/actions/setup-ansible/**'
            setup_python:
              - 'src/assets/ansible/roles/python/**'
              - '.github/workflows/setup-python.yml'
            setup_nodejs:
              - 'src/assets/ansible/roles/nodejs/**'
              - '.github/workflows/setup-nodejs.yml'
            setup_bun:
              - 'src/assets/ansible/roles/bun/**'
              - '.github/workflows/setup-bun.yml'
            setup_ruby:
              - 'src/assets/ansible/roles/ruby/**'
              - '.github/workflows/setup-ruby.yml'
            setup_rust:
              - 'src/assets/ansible/roles/rust/**'
              - '.github/workflows/setup-rust.yml'
            setup_go:
              - 'src/assets/ansible/roles/go/**'
              - '.github/workflows/setup-go.yml'
            setup_nvim:
              - 'src/assets/ansible/roles/nvim/**'
              - '.github/workflows/setup-nvim.yml'
            setup_ide:
              - 'src/assets/ansible/roles/editor/**'
              - '.github/workflows/setup-ide.yml'
            setup_system:
              - 'src/assets/ansible/roles/git/**'
              - 'src/assets/ansible/roles/gh/**'
              - 'src/assets/ansible/roles/shell/**'
              - 'src/assets/ansible/roles/ssh/**'
              - 'src/assets/ansible/roles/system/**'
              - '.github/workflows/setup-system.yml'
            setup_brew_formulae:
              - 'src/assets/ansible/roles/brew/**'
              - '.github/workflows/setup-brew-formulae.yml'

  setup-python:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'python')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_python == 'true'
    uses: ./.github/workflows/setup-python.yml

  setup-nodejs:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'nodejs')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_nodejs == 'true'
    uses: ./.github/workflows/setup-nodejs.yml

  setup-bun:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'bun')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_bun == 'true'
    uses: ./.github/workflows/setup-bun.yml

  setup-ruby:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'ruby')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_ruby == 'true'
    uses: ./.github/workflows/setup-ruby.yml

  setup-rust:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'rust')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_rust == 'true'
    uses: ./.github/workflows/setup-rust.yml

  setup-go:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'go')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_go == 'true'
    uses: ./.github/workflows/setup-go.yml

  setup-nvim:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'nvim')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_nvim == 'true'
    uses: ./.github/workflows/setup-nvim.yml

  setup-ide:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'ide')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_ide == 'true'
    uses: ./.github/workflows/setup-ide.yml

  setup-system:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'system')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_system == 'true'
    uses: ./.github/workflows/setup-system.yml

  setup-brew-formulae:
    needs: changes
    permissions:
      contents: read
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'brew-formulae')) ||
      needs.changes.outputs.all_setups == 'true' ||
      needs.changes.outputs.setup_brew_formulae == 'true'
    uses: ./.github/workflows/setup-brew-formulae.yml
