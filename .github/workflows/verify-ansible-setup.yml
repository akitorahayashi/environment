          mkdir -p "$RUNNER_TEMP/mev-artifact"
          cp target/release/mev "$RUNNER_TEMP/mev-artifact/mev"
          chmod +x "$RUNNER_TEMP/mev-artifact/mev"

      - name: Upload mev binary artifact
