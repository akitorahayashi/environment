name: Verify GitHub Actions Security

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: verify-github-actions-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-github-actions-security:
    name: Verify GitHub Actions Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          install: false

      - name: Install tools from lockfile
        run: mise install --locked actionlint zizmor

      - name: Lint workflows
        run: mise exec -- actionlint -color

      - name: Scan workflow vulnerabilities
        run: mise exec -- zizmor --offline --pedantic --strict-collection --min-severity high .
