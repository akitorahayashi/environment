targets:
  python:
    name: Python
    roles: [python]
    commands: [python]

  pipx:
    name: pipx
    roles: [pipx]
    commands: [pipx]

  nodejs:
    name: Node.js
    roles: [nodejs]
    commands: [nodejs]

  pnpm:
    name: pnpm
    roles: [nodejs, pnpm]
    commands: [nodejs, pnpm]

  coder:
    name: Coder
    roles: [coder]
    commands: [coder]

  bun:
    name: Bun
    roles: [bun]
    commands: [bun]
    verify:
      - export PATH="$HOME/.bun/bin:$PATH"
      - bun --version
      - bun --revision

  ruby:
    name: Ruby
    roles: [ruby]
    commands: [ruby]

  rust:
    name: Rust
    roles: [rust]
    commands: [rust]

  rust-cli:
    name: Rust CLI
    roles: [rust_cli]
    commands: [rust-cli]

  nvim:
    name: Neovim
    roles: [nvim]
    commands: [nvim]
    verify:
      - nvim --headless '+qall'

  vscode:
    name: VS Code
    roles: [editor/vscode]
    commands: [vscode]

  antigravity-ide:
    name: Antigravity IDE
    roles: [editor/antigravity_ide]
    commands: [antigravity-ide]

  zed:
    name: Zed
    roles: [editor/zed]
    commands: [zed]

  xcode:
    name: Xcode
    roles: [editor/xcode]
    commands: [xcode]

  ghostty:
    name: Ghostty
    roles: [ghostty]
    commands: [ghostty]

  system:
    name: System
    roles: [git, gh, shell, system]
    commands: [git, gh, shell, system]
    verify:
      - zsh -c 'export PATH="$RUNNER_TEMP/mev-bin:$PATH"; setopt aliases; source "$HOME/.zshrc"; eval "mk --version"'

  brew-formulae:
    name: Brew Formulae
    roles: [brew]
    commands: [brew-formulae]
    env:
      HOMEBREW_GITHUB_API_TOKEN: "${{ github.token }}"
