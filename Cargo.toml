[package]
name = "mev"
version = "0.6.0"
edition = "2024"
description = "macOS development environment provisioning CLI."
publish = false

[workspace]
members = ["crates/mev-vcs"]

[workspace.dependencies]
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
glob = "0.3"
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial_test = "3.4.0"
tempfile = "3.10"
thiserror = "1.0"
which = "7.0"

[dependencies]
clap.workspace = true
dirs.workspace = true
inquire = "0.7"
mev-vcs = { path = "crates/mev-vcs" }
rust-embed = "8.5"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tempfile.workspace = true
thiserror.workspace = true
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serial_test.workspace = true
